<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Parking</title>
    <link rel="stylesheet" href="/css/style_vehiculos.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="dashboard-container">
    
            <section class="glass-card">
                <div class="card-header">
                    <h2>Gestión de Vehículos</h2>
                    <p>Configuración de tarifas (2 decimales)</p>
                </div>
    
                <form id="form-vehiculo">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Código</label>
                            <input type="text" placeholder="P-001" required>
                        </div>
                        <div class="input-group">
                            <label>Tipo de Vehículo</label>
                            <input type="text" placeholder="Ej: Motocicleta" required>
                        </div>
                        <div class="input-group">
                            <label>Tarifa por Hora (GTQ)</label>
                            <div class="currency-wrapper">
                                <span>Q</span>
                                <input type="number" step="0.01" placeholder="0.00" required>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">GUARDAR TARIFA</button>
                </form>
            </section>

            <section class="glass-card">
                <div class="card-header">
                    <h2>Tipos Registrados</h2>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Vehículo</th>
                                <th class="text-right">Tarifa (Q)</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>M-001</td>
                                <td>Moto</td>
                                <td class="price">Q 5.00</td>
                                <td class="actions text-center">
                                    <button class="btn-action edit" title="Editar">✏️</button>
                                    <button class="btn-action delete" title="Eliminar">🗑️</button>
                                </td>
                            </tr>
                            <tr>
                                <td>A-001</td>
                                <td>Automóvil</td>
                                <td class="price">Q 15.00</td>
                                <td class="actions text-center">
                                    <button class="btn-action edit" title="Editar">✏️</button>
                                    <button class="btn-action delete" title="Eliminar">🗑️</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
