<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Parking</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="main-wrapper">

        <!-- Tarjeta de Login -->
        <div class="login-card">

            <div class="logo-section">
                <div class="parking-icon">
                    <div class="car-dot"></div>
                </div>
                <h1>Campus Parking</h1>
                <p class="subtitle">Soluciones de Estacionamiento</p>
            </div>

            <h2>Acceso al Sistema</h2>

            <!-- Formulario -->
            <form action="#" method="post">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit" href="/css/style_vehiculos.css">INGRESAR</button>
            </form>

            <div class="card-footer">
                <a href="#">¿Olvidó su contraseña? <span>→</span></a>
            </div>
        </div>
    </div>
</body>

</html>
