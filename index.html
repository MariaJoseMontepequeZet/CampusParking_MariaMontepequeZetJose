<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Parking | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-layout" style="display: flex; min-height: 100vh;">
        <app-sidebar style="width: 260px;"></app-sidebar>

        <main style="flex: 1; padding: 40px;">
            <header style="display: flex; justify-content: space-between; margin-bottom: 30px;">
                <h1 style="font-family: 'Outfit';">Panel de Control</h1>
                <div class="user-profile" id="openProfile">Admin</div>
            </header>

            <div class="dashboard-grid" style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                <section class="glass-effect" id="main-content">
                </section>

                <section class="glass-effect">
                    <h3 style="padding: 20px; border-bottom: 1px solid var(--border);">Nuevo Ingreso</h3>
                    <entry-form></entry-form>
                </section>
            </div>
        </main>
    </div>

    <profile-modal id="modalProfile"></profile-modal>

    <script type="module" src="js/app.js"></script>

    <script src="./js/components/EntryForm.js"></script>
    
    <entry-form></entry-form>
</body>

</html>
